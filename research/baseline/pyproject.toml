[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-inspection"
version = "0.3.0"
description = "Reproducible fixed-board PCB inspection software baseline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<6"]

[project.scripts]
pcb-inspect = "pcb_inspection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

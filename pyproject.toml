[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-defect-detection"
version = "1.0.0"
description = "Reference-based PCB inspection with a blue Jupyter interface and PYNQ backend"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "opencv-python-headless>=4.8,<5", "ipywidgets>=7.7,<9", "notebook>=7,<8"]

[project.optional-dependencies]
ocr = ["rapidocr==3.10.0", "onnxruntime>=1.20,<2"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcb_app = ["assets/*.json", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
